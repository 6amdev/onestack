version: '3.8'

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

services:
  # Gateway Layer
  nginx:
    image: nginx:alpine
    container_name: onestack_nginx
    restart: unless-stopped
    networks:
      - public
      - internal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx:/etc/nginx/conf.d:ro
      - ./data/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - parse-server
      - dashboard

  # Application Layer
  parse-server:
    build: ./server
    container_name: onestack_parse
    restart: unless-stopped
    networks:
      - internal
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ID: ${APP_ID}
      MASTER_KEY: ${MASTER_KEY}
      DATABASE_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/${MONGO_DB}?authSource=admin
      SERVER_URL: ${SERVER_URL:-http://localhost:1337/parse}
      PARSE_SERVER_ALLOW_CLIENT_CLASS_CREATION: "false"
      PARSE_SERVER_ENABLE_ANON_USERS: "false"
      PARSE_SERVER_ALLOW_ORIGIN: "*"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    image: parseplatform/parse-dashboard:5.2.0
    container_name: onestack_dashboard
    restart: unless-stopped
    networks:
      - internal
    ports:          # <-- เพิ่มบรรทัดนี้
      - "4040:4040" # <-- เพิ่มบรรทัดนี้
    volumes:
      - ./configs/dashboard/parse-dashboard-config.json:/src/Parse-Dashboard/parse-dashboard-config.json
    environment:
      PARSE_DASHBOARD_ALLOW_INSECURE_HTTP: "true"
    command: parse-dashboard --config /src/Parse-Dashboard/parse-dashboard-config.json --allowInsecureHTTP
    depends_on:
      - parse-server
  # Data Layer
  mongodb:
    image: mongo:7.0
    container_name: onestack_mongodb
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - mongo_data:/data/db
      - ./backups/mongo:/backup
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    command: mongod --auth --bind_ip_all
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: onestack_redis
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s